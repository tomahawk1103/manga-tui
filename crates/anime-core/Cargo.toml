[package]
name = "anime-core"
version = "0.3.1"
edition = "2024"
authors = ["tomahawk1103", "drodri22"]
license = "MIT"
description = "Native Rust anime provider, video extractor, and local playback engine for manga-tui"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "charset", "cookies", "http2", "gzip", "deflate", "stream"] }
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
scraper = "0.24.0"
regex = "1.12.2"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
rand = "0.9"
log = { version = "0.4", features = ["std", "serde"] }
strum = "0.26.3"
strum_macros = "0.26"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots"] }
open = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
httpmock = "0.7.0-rc.1"
pretty_assertions = "1.4.0"
