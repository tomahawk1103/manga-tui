<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime · manga-tui</title>
<style>
:root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111217; color: #f4f2f8 }
body { margin: 0 }
main { max-width: 1100px; margin: auto; padding: clamp(16px, 4vw, 40px) }
h1 { margin: 0 0 16px; font-size: clamp(22px, 4vw, 34px) }
video { display: block; width: 100%; max-height: 70dvh; aspect-ratio: 16/9; background: #000; border-radius: 12px }
.controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-top: 16px }
label { display: grid; gap: 5px; min-width: 0; max-width: 100%; color: #cbc5d4; font-size: 0.9rem }
button, select { font: inherit; min-height: 42px; padding: 0 12px; color: #fbf9ff; background: #252330; border: 1px solid #494459; border-radius: 8px }
button { cursor: pointer }
button:hover:not(:disabled) { background: #373248 }
button:disabled { opacity: .45; cursor: default }
:focus-visible { outline: 2px solid #bcaaff; outline-offset: 3px }
#status { min-height: 1.5em; color: #e4cbff }
</style>
<script defer src="/assets/__TOKEN__/hls.min.js"></script>
<script defer src="/assets/__TOKEN__/player.js"></script>
</head>
<body>
<main>
  <h1 id="title">Anime</h1>
  <video id="video" controls playsinline aria-label="Reproductor de anime"></video>
  <div class="controls">
    <button id="previous" disabled>Anterior</button>
    <label>Episodio<select id="episode" disabled></select></label>
    <button id="next" disabled>Siguiente</button>
    <label>Variante<select id="variant" disabled></select></label>
    <label>Servidor<select id="mirror" disabled></select></label>
    <button id="intro" disabled>Saltar intro (+85 s)</button>
  </div>
  <p id="status" role="status"></p>
</main>
</body>
</html>
