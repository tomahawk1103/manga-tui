<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime · manga-tui</title>
<style>
:root {
  color-scheme: dark;
  font: 16px system-ui, sans-serif;
  background: #0d0e16;
  color: #f4f2fb;
  --panel: #181a27;
  --border: #33364b;
  --muted: #b5b7cc;
  --accent: #c4b5fd;
}
* { box-sizing: border-box }
body {
  margin: 0;
  min-height: 100dvh;
  background: radial-gradient(ellipse at 20% 0%, #22203b, transparent 60%);
}
main { max-width: 1240px; margin: auto; padding: clamp(12px, 4vw, 42px) }
header { border-inline-start: 3px solid var(--accent); padding-inline-start: 14px; margin-bottom: 20px }
h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.35rem); letter-spacing: -.03em; overflow-wrap: anywhere }
.player {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
  box-shadow: 0 20px 60px #0006;
}
video { display: block; width: 100%; max-height: 70dvh; aspect-ratio: 16/9; background: #000; border-radius: 15px 15px 0 0 }
.controls { display: flex; flex-wrap: wrap; align-items: end; gap: 16px 24px; padding: clamp(10px, 2vw, 20px) }
.episode-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; flex: 2 1 320px }
.playback-options { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); flex-basis: 240px; flex-grow: 1 }
.episode-nav, .playback-options { align-items: end; gap: 8px; min-width: 0 }
label { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: .8rem }
button, select {
  font: inherit;
  font-size: .875rem;
  min-width: 0;
  min-height: 44px;
  padding: 0 10px;
  color: inherit;
  background: #222437;
  border: 1px solid var(--border);
  border-radius: 8px;
}
select { width: 100%; text-overflow: ellipsis }
button { cursor: pointer }
button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--accent); background: #302d47 }
:is(button, select):disabled { opacity: .55; cursor: default }
#next { color: var(--accent); border-color: #615684 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#status { margin: 12px 0 0; color: var(--accent); font-size: .875rem }
</style>
<script defer src="/assets/__TOKEN__/hls.min.js"></script>
<script defer src="/assets/__TOKEN__/player.js"></script>
</head>
<body>
<main>
  <header><h1 id="title">Anime</h1></header>
  <div class="player">
    <video id="video" controls playsinline aria-label="Reproductor de anime"></video>
    <div class="controls">
      <div class="episode-nav">
        <button id="previous" disabled>‹ Anterior</button>
        <label>Episodio<select id="episode" disabled></select></label>
        <button id="next" disabled>Siguiente ›</button>
      </div>
      <div class="playback-options">
        <label>Variante<select id="variant" disabled></select></label>
        <label>Servidor<select id="mirror" disabled></select></label>
      </div>
      <button id="intro" disabled>Saltar intro (+85 s)</button>
    </div>
  </div>
  <p id="status" role="status"></p>
</main>
</body>
</html>
