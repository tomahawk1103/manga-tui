<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime · manga-tui</title>
<style>
:root {
  color-scheme: dark;
  font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #080912;
  color: #f6f1ea;
  --panel: rgba(15, 14, 24, 0.88);
  --border: rgba(245, 158, 11, 0.22);
  --border-soft: rgba(244, 63, 94, 0.34);
  --muted: #c2b8c9;
  --accent: #f43f5e;
  --gold: #f5b942;
}
* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(180deg, #070812 0%, #141026 52%, #241124 100%);
  overflow-x: hidden;
}
.jp-backdrop {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  user-select: none;
}
.jp-seal {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 0;
  pointer-events: none;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  opacity: .55;
}
.jp-seal.left { left: clamp(8px, 1.4vw, 22px) }
.jp-seal.right { right: clamp(8px, 1.4vw, 22px) }
.jp-kanji {
  writing-mode: vertical-rl;
  letter-spacing: .38em;
  font-size: clamp(.78rem, 1vw, .95rem);
  font-weight: 600;
  color: rgba(245, 185, 66, 0.55);
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
}
.hanko {
  padding: 5px 4px;
  border: 1.5px solid rgba(244, 63, 94, 0.72);
  border-radius: 4px;
  color: rgba(244, 63, 94, 0.9);
  background: rgba(244, 63, 94, 0.08);
  writing-mode: vertical-rl;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .12em;
}
main {
  position: relative;
  z-index: 1;
  width: 86vw;
  max-width: none;
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(14px, 3.6dvh, 42px) 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 16px;
  border-inline-start: 3px solid var(--accent);
  padding: 6px 14px;
  margin-bottom: 12px;
  background: linear-gradient(90deg, rgba(16, 13, 24, 0.78), rgba(16, 13, 24, 0.25) 70%, transparent);
  border-radius: 0 10px 10px 0;
}
.title-wrap {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 12px;
  min-width: 0;
}
h1 {
  margin: 0;
  font-size: clamp(1.3rem, 2.4vw, 2.15rem);
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
}
.ep-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 600;
  color: #fde68a;
  background: rgba(244, 63, 94, 0.2);
  border: 1px solid rgba(245, 185, 66, 0.42);
  white-space: nowrap;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 3px 10px;
  border-radius: 6px;
  font-size: .78rem;
  line-height: 1.3;
  color: #ede6de;
  background: rgba(22, 18, 32, 0.85);
  border: 1px solid var(--border);
}
.chip.accent {
  color: #fda4af;
  border-color: var(--border-soft);
  background: rgba(244, 63, 94, 0.14);
}
.player {
  position: relative;
  width: 100%;
  border: 1px solid rgba(245, 185, 66, 0.28);
  background: var(--panel);
  backdrop-filter: blur(8px);
  border-radius: 16px;
  box-shadow:
    0 26px 76px rgba(0, 0, 0, 0.72),
    0 0 0 1px rgba(244, 63, 94, 0.14) inset;
  overflow: hidden;
}
.video-stage {
  position: relative;
  width: 100%;
  height: calc(84dvh - 120px);
  min-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 45%, rgba(244, 63, 94, 0.12), transparent 62%),
    repeating-linear-gradient(
      90deg,
      rgba(245, 185, 66, 0.035) 0 1px,
      transparent 1px 44px
    ),
    repeating-linear-gradient(
      0deg,
      rgba(245, 185, 66, 0.03) 0 1px,
      transparent 1px 44px
    ),
    linear-gradient(180deg, #0b0a14 0%, #141020 100%);
}
.stage-bg {
  position: absolute;
  inset: -16px;
  width: calc(100% + 32px);
  height: calc(100% + 32px);
  object-fit: cover;
  filter: blur(26px) saturate(1.15) brightness(0.3);
  opacity: .68;
  pointer-events: none;
  z-index: 0;
}
video {
  position: relative;
  z-index: 1;
  display: block;
  height: 100%;
  width: auto;
  max-width: 100%;
  background: #000;
  box-shadow: 0 0 56px rgba(0, 0, 0, 0.92);
}
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 16px 24px;
  padding: clamp(12px, 1.5vw, 20px);
  border-top: 1px solid rgba(245, 185, 66, 0.22);
  background: rgba(14, 13, 22, 0.92);
}
.episode-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; flex: 2 1 340px }
.playback-options { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); flex-basis: 260px; flex-grow: 1 }
.episode-nav, .playback-options { align-items: end; gap: 8px; min-width: 0 }
label { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: .8rem }
button, select {
  font: inherit;
  font-size: .875rem;
  min-width: 0;
  min-height: 44px;
  padding: 0 12px;
  color: inherit;
  background: #1c192b;
  border: 1px solid rgba(245, 185, 66, 0.2);
  border-radius: 8px;
}
select { width: 100%; text-overflow: ellipsis }
button { cursor: pointer; transition: border-color .15s, background .15s }
button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--gold); background: #2a2138 }
:is(button, select):disabled { opacity: .55; cursor: default }
#next { color: #fde68a; border-color: rgba(244, 63, 94, 0.6); background: rgba(244, 63, 94, 0.14) }
#next:hover:not(:disabled) { border-color: var(--accent); background: rgba(244, 63, 94, 0.24) }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
#status { margin: 12px 2px 0; min-height: 1.2em; color: #fda4af; font-size: .875rem; text-shadow: 0 1px 8px #000 }

@media (max-width: 1120px) {
  .jp-seal { display: none }
}
@media (max-width: 900px) {
  main { width: 95vw }
  .video-stage { height: calc(74dvh - 110px); min-height: 220px }
}
</style>
<script defer src="/assets/__TOKEN__/hls.min.js"></script>
<script defer src="/assets/__TOKEN__/player.js"></script>
</head>
<body>

<div class="jp-seal left" aria-hidden="true">
  <span class="hanko">劇場</span>
  <span class="jp-kanji">アニメ鑑賞</span>
</div>
<div class="jp-seal right" aria-hidden="true">
  <span class="jp-kanji">物語放映</span>
  <span class="hanko">動画</span>
</div>

<main>
  <header class="stage-header">
    <div class="title-wrap">
      <h1 id="title">Anime</h1>
      <span id="ep-badge" class="ep-badge">Ep. 1</span>
    </div>
    <div id="meta-badges" class="chips"></div>
  </header>
  <div class="player">
    <div class="video-stage">
      <img id="stage-bg" class="stage-bg" alt="" hidden>
      <video id="video" controls playsinline aria-label="Reproductor de anime"></video>
    </div>
    <div class="controls">
      <div class="episode-nav">
        <button id="previous" disabled>‹ Anterior</button>
        <label>Episodio<select id="episode" disabled></select></label>
        <button id="next" disabled>Siguiente ›</button>
      </div>
      <div class="playback-options">
        <label>Variante<select id="variant" disabled></select></label>
        <label>Servidor<select id="mirror" disabled></select></label>
      </div>
      <button id="intro" disabled>Saltar intro (+85 s)</button>
    </div>
  </div>
  <p id="status" role="status"></p>
</main>
