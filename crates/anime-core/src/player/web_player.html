<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime · manga-tui</title>
<style>
:root {
  color-scheme: dark;
  font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0d0e16;
  color: #f4f2fb;
  --panel: rgba(24, 26, 39, 0.94);
  --border: #33364b;
  --muted: #b5b7cc;
  --accent: #c4b5fd;
}
* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 18% 0%, rgba(76, 56, 138, 0.24), transparent 52%),
    radial-gradient(ellipse at 82% 0%, rgba(45, 72, 132, 0.18), transparent 52%),
    #0d0e16;
}
main {
  width: 86vw;
  max-width: none;
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(14px, 4dvh, 44px) 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 16px;
  border-inline-start: 3px solid var(--accent);
  padding-inline-start: 14px;
  margin-bottom: 14px;
}
.title-wrap {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 12px;
  min-width: 0;
}
h1 {
  margin: 0;
  font-size: clamp(1.3rem, 2.5vw, 2.2rem);
  letter-spacing: -.03em;
  overflow-wrap: anywhere;
}
.ep-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 600;
  color: var(--accent);
  background: rgba(196, 181, 253, 0.14);
  border: 1px solid rgba(196, 181, 253, 0.28);
  white-space: nowrap;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 3px 9px;
  border-radius: 6px;
  font-size: .78rem;
  line-height: 1.3;
  color: #dcdaf0;
  background: #23263a;
  border: 1px solid var(--border);
}
.chip.accent {
  color: var(--accent);
  border-color: rgba(196, 181, 253, 0.24);
  background: rgba(196, 181, 253, 0.12);
}
.player {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
  box-shadow: 0 24px 68px rgba(0, 0, 0, 0.58);
  overflow: hidden;
}
video {
  display: block;
  width: 100%;
  height: calc(84dvh - 120px);
  min-height: 340px;
  background: #000;
  object-fit: contain;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 16px 24px;
  padding: clamp(12px, 1.5vw, 20px);
  border-top: 1px solid var(--border);
}
.episode-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; flex: 2 1 340px }
.playback-options { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); flex-basis: 260px; flex-grow: 1 }
.episode-nav, .playback-options { align-items: end; gap: 8px; min-width: 0 }
label { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: .8rem }
button, select {
  font: inherit;
  font-size: .875rem;
  min-width: 0;
  min-height: 44px;
  padding: 0 12px;
  color: inherit;
  background: #222437;
  border: 1px solid var(--border);
  border-radius: 8px;
}
select { width: 100%; text-overflow: ellipsis }
button { cursor: pointer; transition: border-color .15s, background .15s }
button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--accent); background: #302d47 }
:is(button, select):disabled { opacity: .55; cursor: default }
#next { color: var(--accent); border-color: #615684 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#status { margin: 12px 2px 0; min-height: 1.2em; color: var(--accent); font-size: .875rem }

@media (max-width: 900px) {
  main { width: 95vw }
  video { height: calc(74dvh - 110px); min-height: 220px }
}
</style>
<script defer src="/assets/__TOKEN__/hls.min.js"></script>
<script defer src="/assets/__TOKEN__/player.js"></script>
</head>
<body>
<main>
  <header class="stage-header">
    <div class="title-wrap">
      <h1 id="title">Anime</h1>
      <span id="ep-badge" class="ep-badge">Ep. 1</span>
    </div>
    <div id="meta-badges" class="chips"></div>
  </header>
  <div class="player">
    <video id="video" controls playsinline aria-label="Reproductor de anime"></video>
    <div class="controls">
      <div class="episode-nav">
        <button id="previous" disabled>‹ Anterior</button>
        <label>Episodio<select id="episode" disabled></select></label>
        <button id="next" disabled>Siguiente ›</button>
      </div>
      <div class="playback-options">
        <label>Variante<select id="variant" disabled></select></label>
        <label>Servidor<select id="mirror" disabled></select></label>
      </div>
      <button id="intro" disabled>Saltar intro (+85 s)</button>
    </div>
  </div>
  <p id="status" role="status"></p>
</main>
</body>
</html>
