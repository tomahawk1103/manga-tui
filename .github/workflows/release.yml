name: Release
  
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        targets:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.targets.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt install libdbus-1-dev pkg-config

      - name: Setup
        run: rustup target add ${{ matrix.targets.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.targets.target }}
      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> ${GITHUB_ENV}
      - name: Archive
        run: tar -czf manga-tui-${{ env.RELEASE_VERSION }}-${{ matrix.targets.target }}.tar.gz -C target/${{ matrix.targets.target }}/release manga-tui
      - name: Checksum
        run: shasum -a 256 manga-tui-${{ env.RELEASE_VERSION }}-${{ matrix.targets.target }}.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.targets.target }}
          path: manga-tui-${{ env.RELEASE_VERSION }}-${{ matrix.targets.target }}.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Set release version
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and package portable Windows ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version ${{ env.RELEASE_VERSION }} -Target x86_64-pc-windows-msvc -OutputDir dist

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows installer (Inno Setup)
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -Version ${{ env.RELEASE_VERSION }} -Target x86_64-pc-windows-msvc -OutputDir dist -SkipBuild

      - name: Test Windows installer upgrade and uninstall data preservation
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -ExpectedVersion ${{ env.RELEASE_VERSION }} -TestSystemAppData

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-x86_64-pc-windows-msvc-portable
          path: dist/manga-tui-${{ env.RELEASE_VERSION }}-x86_64-pc-windows-msvc-portable.zip*
          if-no-files-found: error

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-x86_64-pc-windows-msvc-installer
          path: dist/manga-tui-${{ env.RELEASE_VERSION }}-x86_64-pc-windows-msvc-setup.exe*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Checksum
        run: sha256sum releases/* > ./releases/checksum.txt
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          draft: true
          generate_release_notes: true
          make_latest: true
          files: |
            releases/*
