name: Mangora Multiplatform Release

on:
  push:
    tags:
      - 'mangora-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar GitHub Release con los instaladores y el APK'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Tag de la release si publish_release es true (ej. mangora-v0.1.0)'
        type: string
        required: false
        default: 'mangora-v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Build and package Mangora Windows installers (NSIS + MSI)
        shell: pwsh
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: ./scripts/package-mangora-windows.ps1 -Bundles "nsis,msi" -OutputDir dist-mangora

      - name: Upload Mangora Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: mangora-windows-installers
          path: dist-mangora/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 27, SDK 35 & Rust targets
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found under $ANDROID_SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "Using ANDROID_SDK=$ANDROID_SDK and sdkmanager=$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true)
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$ANDROID_SDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK"
            echo "NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri Android & build APK
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          npm run build
          npx tauri android init --ci
          node ../../scripts/configure-mangora-android.mjs --android-dir src-tauri/gen/android
          npx tauri android build --apk --target aarch64

      - name: Align, Sign & Verify Android APK (v1 + v2 + v3)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/mangora/src-tauri/tauri.conf.json').version")
          UNSIGNED_APK=$(find apps/mangora/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "${UNSIGNED_APK:-}" ]; then
            echo "No se encontro ningun APK generado por Tauri." >&2
            exit 1
          fi
          echo "APK generado sin firmar: $UNSIGNED_APK"

          KEYSTORE_PATH="$RUNNER_TEMP/mangora-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-mangora}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 no configurado; generando keystore temporal de CI (las actualizaciones futuras sobre este APK requeriran desinstalar si cambia la firma)."
            {
              echo "### Aviso de firma Android"
              echo "No se encontro el secret \`ANDROID_KEYSTORE_BASE64\`. El APK se firmo con un certificado temporal de CI."
              echo "Ejecuta \`./scripts/setup-android-signing.ps1\` en local y añade los 4 secrets al repositorio para firmar siempre con el mismo certificado."
            } >> "$GITHUB_STEP_SUMMARY"
            KS_PASS="mangora-ci-temp"
            KS_ALIAS="mangora"
            KEY_PASS="mangora-ci-temp"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Mangora CI, OU=MangaTUI, O=tomahawk1103, C=ES"
          fi

          mkdir -p dist-android
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          SIGNED_APK="dist-android/Mangora-${VERSION}-android-arm64-v8a.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:${KEY_PASS}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED_APK"
          sha256sum "$SIGNED_APK" > "${SIGNED_APK}.sha256"
          (cd dist-android && sha256sum "Mangora-${VERSION}-android-arm64-v8a.apk" > SHA256SUMS-android.txt)
          ls -lh dist-android/

      - name: Upload Mangora Android APK
        uses: actions/upload-artifact@v5
        with:
          name: mangora-android-apk
          path: dist-android/*
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust Apple iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri iOS & compile iOS simulator verification build
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          npm run build
          npx tauri ios init --ci
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios

  publish-release:
    if: startsWith(github.ref, 'refs/tags/mangora-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Mangora GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/mangora-v') && github.ref_name || inputs.release_tag }}
          files: release-assets/*
          generate_release_notes: true
