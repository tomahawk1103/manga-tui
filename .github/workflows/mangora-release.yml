name: Mangora Multiplatform Release

on:
  push:
    tags:
      - 'mangora-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar GitHub Release con Windows, APK Android e IPA iOS (SideStore)'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Tag de la release si publish_release es true (ej. mangora-v0.1.0)'
        type: string
        required: false
        default: 'mangora-v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Build and package Mangora Windows installers (NSIS + MSI)
        shell: pwsh
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: ./scripts/package-mangora-windows.ps1 -Bundles "nsis,msi" -OutputDir dist-mangora

      - name: Upload Mangora Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: mangora-windows-installers
          path: dist-mangora/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 27, SDK 35 & Rust targets
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found under $ANDROID_SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "Using ANDROID_SDK=$ANDROID_SDK and sdkmanager=$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true)
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$ANDROID_SDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK"
            echo "NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri Android & build APK
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          npm run build
          npx tauri android init --ci
          node ../../scripts/configure-mangora-android.mjs --android-dir src-tauri/gen/android
          npx tauri android build --apk --target aarch64

      - name: Align, Sign & Verify Android APK (v1 + v2 + v3)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/mangora/src-tauri/tauri.conf.json').version")
          UNSIGNED_APK=$(find apps/mangora/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "${UNSIGNED_APK:-}" ]; then
            echo "No se encontro ningun APK generado por Tauri." >&2
            exit 1
          fi
          echo "APK generado sin firmar: $UNSIGNED_APK"

          KEYSTORE_PATH="$RUNNER_TEMP/mangora-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
            KS_SIZE=$(wc -c < "$KEYSTORE_PATH")
            echo "Keystore decodificado desde secret: ${KS_SIZE} bytes"
            if [ "$KS_SIZE" -lt 1000 ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 parece truncado (${KS_SIZE} bytes). Vuelve a copiarlo completo al portapapeles con PowerShell Set-Clipboard." >&2
              exit 1
            fi
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-mangora}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            keytool -list -keystore "$KEYSTORE_PATH" -alias "$KS_ALIAS" -storepass "$KS_PASS" >/dev/null
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 no configurado; generando keystore temporal de CI (las actualizaciones futuras sobre este APK requeriran desinstalar si cambia la firma)."
            {
              echo "### Aviso de firma Android"
              echo "No se encontro el secret \`ANDROID_KEYSTORE_BASE64\`. El APK se firmo con un certificado temporal de CI."
              echo "Ejecuta \`./scripts/setup-android-signing.ps1\` en local y añade los 4 secrets al repositorio para firmar siempre con el mismo certificado."
            } >> "$GITHUB_STEP_SUMMARY"
            KS_PASS="mangora-ci-temp"
            KS_ALIAS="mangora"
            KEY_PASS="mangora-ci-temp"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Mangora CI, OU=MangaTUI, O=tomahawk1103, C=ES"
          fi

          mkdir -p dist-android
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          SIGNED_APK="dist-android/Mangora-${VERSION}-android-arm64-v8a.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:${KEY_PASS}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED_APK"
          sha256sum "$SIGNED_APK" > "${SIGNED_APK}.sha256"
          (cd dist-android && sha256sum "Mangora-${VERSION}-android-arm64-v8a.apk" > SHA256SUMS-android.txt)
          ls -lh dist-android/

      - name: Upload Mangora Android APK
        uses: actions/upload-artifact@v5
        with:
          name: mangora-android-apk
          path: dist-android/*
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust stable with Apple iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri iOS & configure Info.plist
        working-directory: apps/mangora
        run: |
          set -euo pipefail
          npm run build
          npx tauri ios init --ci
          node ../../scripts/configure-mangora-ios.mjs --apple-dir src-tauri/gen/apple

      - name: Build unsigned iOS xcarchive & package IPA
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          XCODEPROJ=$(find src-tauri/gen/apple -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if [ -z "${XCODEPROJ:-}" ]; then
            echo "No se encontro ningun .xcodeproj en src-tauri/gen/apple." >&2
            exit 1
          fi

          IOS_SCHEME=$(xcodebuild -list -json -project "$XCODEPROJ" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            const schemes = (data.project && data.project.schemes) || [];
            const found = schemes.find((s) => s.endsWith('_iOS')) || 'Mangora_iOS';
            process.stdout.write(found);
          ")
          echo "Using Xcode project=$XCODEPROJ scheme=$IOS_SCHEME version=$VERSION"

          ARCHIVE_PATH="$RUNNER_TEMP/Mangora.xcarchive"
          rm -rf "$ARCHIVE_PATH"
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          APP_BUNDLE=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "${APP_BUNDLE:-}" ]; then
            echo "No se encontro el bundle .app dentro del xcarchive." >&2
            exit 1
          fi

          rm -rf "$APP_BUNDLE/_CodeSignature"

          PLIST="$APP_BUNDLE/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST")
          echo "Verified Info.plist: CFBundleIdentifier=$BUNDLE_ID CFBundleShortVersionString=$SHORT_VER CFBundleExecutable=$EXEC_NAME"
          if [ "$BUNDLE_ID" != "io.github.tomahawk1103.mangora" ]; then
            echo "CFBundleIdentifier inesperado: $BUNDLE_ID" >&2
            exit 1
          fi
          if [ ! -f "$APP_BUNDLE/$EXEC_NAME" ]; then
            echo "No se encontro el binario Mach-O: $APP_BUNDLE/$EXEC_NAME" >&2
            exit 1
          fi
          file "$APP_BUNDLE/$EXEC_NAME"

          STAGE_DIR="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_BUNDLE" "$STAGE_DIR/Payload/"

          DIST_IOS_DIR="$(cd ../.. && pwd)/dist-ios"
          mkdir -p "$DIST_IOS_DIR"
          IPA_NAME="Mangora-${VERSION}-ios-unsigned.ipa"
          IPA_PATH="${DIST_IOS_DIR}/${IPA_NAME}"
          (cd "$STAGE_DIR" && zip -r -q "$IPA_PATH" Payload)

          unzip -t "$IPA_PATH" >/dev/null
          unzip -l "$IPA_PATH" | grep -E "Payload/[^/]+\.app/Info\.plist" >/dev/null

          (
            cd "$DIST_IOS_DIR"
            shasum -a 256 "$IPA_NAME" > "${IPA_NAME}.sha256"
            shasum -a 256 "$IPA_NAME" > SHA256SUMS-ios.txt
          )
          ls -lh "$DIST_IOS_DIR/"

      - name: Upload Mangora iOS IPA
        uses: actions/upload-artifact@v5
        with:
          name: mangora-ios-ipa
          path: dist-ios/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/mangora-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Update SideStore source JSON
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/mangora-v') && github.ref_name || inputs.release_tag }}"
          VERSION=$(node -p "require('./apps/mangora/src-tauri/tauri.conf.json').version")
          IPA_FILE=$(find release-assets -type f -name "Mangora-*-ios-unsigned.ipa" | head -n 1)
          if [ -z "${IPA_FILE:-}" ]; then
            echo "No se encontro ningun IPA iOS en release-assets." >&2
            exit 1
          fi
          node scripts/update-sidestore-source.mjs \
            --source docs/sidestore.json \
            --version "$VERSION" \
            --tag "$TAG" \
            --ipa "$IPA_FILE" \
            --notes "Mangora $TAG para iOS (SideStore / AltStore)"
          cp docs/sidestore.json release-assets/sidestore.json
          echo "SIDESTORE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create Mangora GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/mangora-v') && github.ref_name || inputs.release_tag }}
          files: release-assets/*
          generate_release_notes: true

      - name: Commit updated docs/sidestore.json for GitHub Pages
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/sidestore.json; then
            echo "docs/sidestore.json sin cambios."
          else
            TARGET_BRANCH=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.ref_name }}" ]; then
              TARGET_BRANCH="${{ github.ref_name }}"
            else
              git fetch origin --prune
              for candidate in main MANGORA; do
                if git show-ref --verify --quiet "refs/remotes/origin/$candidate" && git merge-base --is-ancestor HEAD "refs/remotes/origin/$candidate"; then
                  TARGET_BRANCH="$candidate"
                  break
                fi
              done
            fi

            if [ -n "$TARGET_BRANCH" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git stash push -m "sidestore-update" -- docs/sidestore.json
              git checkout "$TARGET_BRANCH"
              git pull --ff-only origin "$TARGET_BRANCH" || true
              git stash pop
              git add docs/sidestore.json
              git commit -m "chore(ios): update SideStore source for ${SIDESTORE_TAG}"
              git push origin "HEAD:${TARGET_BRANCH}"
            else
              echo "::warning::No se pudo determinar una rama destino para publicar docs/sidestore.json automáticamente."
            fi
          fi

          {
            echo "### SideStore / AltStore (iOS)"
            echo "- Fuente JSON: https://tomahawk1103.github.io/manga-tui/sidestore.json"
            echo "- Enlace directo 1 toque: \`sidestore://source?url=https%3A%2F%2Ftomahawk1103.github.io%2Fmanga-tui%2Fsidestore.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
