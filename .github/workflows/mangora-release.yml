name: Mangora Multiplatform Release

on:
  push:
    tags:
      - 'mangora-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Build and package Mangora Windows installers (NSIS + MSI)
        shell: pwsh
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: ./scripts/package-mangora-windows.ps1 -Bundles nsis,msi -OutputDir dist-mangora

      - name: Upload Mangora Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: mangora-windows-installers
          path: dist-mangora/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27 & Rust targets
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri Android & build APK
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          npm run build
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Upload Mangora Android APK
        uses: actions/upload-artifact@v5
        with:
          name: mangora-android-apk
          path: apps/mangora/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mangora/package-lock.json

      - name: Setup Rust Apple iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Mangora frontend dependencies
        working-directory: apps/mangora
        run: npm ci

      - name: Initialize Tauri iOS & compile iOS simulator verification build
        working-directory: apps/mangora
        env:
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_ID: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_GDRIVE_CLIENT_SECRET: ${{ secrets.MANGA_TUI_GDRIVE_CLIENT_SECRET }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_ID: ${{ secrets.MANGA_TUI_MAL_CLIENT_ID }}
          MANGA_TUI_EMBEDDED_MAL_CLIENT_SECRET: ${{ secrets.MANGA_TUI_MAL_CLIENT_SECRET }}
          MANGORA_KOFI_URL: ${{ vars.MANGORA_KOFI_URL }}
          MANGORA_SPONSORS_URL: ${{ vars.MANGORA_SPONSORS_URL }}
          MANGORA_FEEDBACK_PROXY_URL: ${{ vars.MANGORA_FEEDBACK_PROXY_URL }}
        run: |
          npm run build
          npx tauri ios init --ci
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios

  publish-release:
    if: startsWith(github.ref, 'refs/tags/mangora-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Mangora GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
