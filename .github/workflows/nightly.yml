name: Nightly Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANGA_TUI_BUILD_CHANNEL: nightly

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      cargo_version: ${{ steps.meta.outputs.cargo_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      commit_ts: ${{ steps.meta.outputs.commit_ts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Setup target
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Extract build metadata
        id: meta
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Path "Cargo.toml" -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $cargoVersion = $Matches[1]
          } else {
            throw "Could not determine version from Cargo.toml"
          }
          $shortSha = ("${{ github.sha }}").Substring(0, 7)
          $commitTs = (git show -s --format=%ct HEAD).Trim()

          "GITHUB_SHA=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MANGA_TUI_BUILD_TIMESTAMP=$commitTs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "cargo_version=$cargoVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit_ts=$commitTs" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and package portable Windows ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version nightly -Target x86_64-pc-windows-msvc -OutputDir dist

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows installer (Inno Setup)
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -Version nightly -Target x86_64-pc-windows-msvc -OutputDir dist -SkipBuild

      - name: Upload Windows nightly artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nightly-windows
          path: dist/manga-tui-nightly-x86_64-pc-windows-msvc-*
          if-no-files-found: error

  publish-nightly:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: nightly-windows
          path: releases

      - name: Generate checksum.txt
        run: (cd releases && sha256sum manga-tui-* > checksum.txt)

      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - name: Prepare nightly release notes
        run: |
          {
            echo "<!-- manga-tui-meta: commit=${{ github.sha }} version=${{ needs.build-windows.outputs.cargo_version }} timestamp=${{ needs.build-windows.outputs.commit_ts }} -->"
            echo "Compilación automática desde \`main\` (commit \`${{ needs.build-windows.outputs.short_sha }}\`)."
            echo ""
            git log -n 5 --pretty=format:"- %s (\`%h\`)"
            echo ""
          } > /tmp/nightly_notes.md

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: nightly
          name: "Manga TUI Nightly (v${{ needs.build-windows.outputs.cargo_version }} · ${{ needs.build-windows.outputs.short_sha }})"
          body_path: /tmp/nightly_notes.md
          prerelease: true
          draft: false
          make_latest: false
          files: |
            releases/*
