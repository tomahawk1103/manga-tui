[package]
name = "mangora"
version = "0.1.0"
edition = "2024"
authors = ["tomahawk1103", "drodri22"]
license = "MIT"
description = "Mangora desktop manga reader powered by manga-core"

[lib]
name = "mangora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
manga-core = { path = "../../../crates/manga-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.37.0", features = ["bundled"] }
log = "0.4"
tokio = { version = "1.47.1", features = ["sync", "rt-multi-thread", "time"] }
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[dev-dependencies]
httpmock = "0.7.0-rc.1"
pretty_assertions = "1.4.0"
uuid = { version = "1.18.1", features = ["v4"] }
